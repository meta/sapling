name: EdenFS Linux

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # GCC 13, the runner's default, crashes on some of eden's coroutine tests.
    # CC and CXX also reach cargo's cc crate, which compiles cxx's runtime and
    # the -sys crates' C code.
    env:
      SCCACHE_GHA_ENABLED: "on"
      # sccache caches cargo's crates too, and keeps one server, so the stats
      # at the end cover the whole build.
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      CC: gcc-14
      CXX: g++-14
    steps:

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    - name: Free up disk space
      run: sudo rm -rf /usr/local/lib/android

    # eden, fizz and fbthrift require these, and nothing fetches them, and the
    # bindgen that edenfsctl's libsqlite3-sys runs needs libclang. gflags,
    # libevent and xxhash are fetched, but eden, wangle and fb303 only build
    # with installed copies. The build fetches the rest, folly and Boost among
    # them.
    # TODO(T295212250): fetch these too, as folly does for what it requires,
    # and drop this step.
    - name: Update system package info
      run: sudo --preserve-env=http_proxy apt-get update
    - name: Install system deps
      run: >
        sudo --preserve-env=http_proxy apt-get install -y
        libclang-dev libcurl4-openssl-dev libevent-dev libgflags-dev libre2-dev
        libsodium-dev libssl-dev libxxhash-dev libzstd-dev ninja-build patchelf
        pkg-config zlib1g-dev

    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@stable

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # eden and its Meta dependencies are exported from one repository within
    # minutes of each other, but build/deps/github_hashes is refreshed about
    # once a day, so a change that spans projects breaks a pinned build until
    # then. FB_FETCH_AS_OF builds every Meta dependency from the commit that was
    # on its main at this commit's time instead. ShipIt dates every exported
    # commit with the time its fbsource commit landed, so that's the code this
    # commit was exported with, on a rerun too.
    - name: Find this commit's time
      run: echo "COMMIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

    # fbcode_builder compiles with -g whatever the build type, and with their
    # debug info the test executables alone take about 30 GB.
    - name: Configure
      run: >
        cmake -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_TESTS=ON
        -DFB_FETCH_AS_OF="$COMMIT_TIME"
        -DPython3_EXECUTABLE="$(which python)"
        -DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    # Ninja's default of nproc+2 jobs leaves less memory headroom than one
    # compile per CPU on a cold cache.
    - name: Build
      run: >
        cmake --build _build -j "$(nproc)"
        --target edenfs edenfs_privhelper edenfsctl.cargo

    - name: Build tests
      run: cmake --build _build -j "$(nproc)"

    # The PrivHelper tests that call runInMountNamespace() set up a user and
    # mount namespace, which Ubuntu 24.04's AppArmor doesn't allow unprivileged
    # processes to do.
    - name: Test
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        ctest --test-dir _build --output-on-failure

    # upload-artifact's zip doesn't keep file permissions, so the executables
    # would lose their exec bits. A tarball keeps them.
    - name: Install
      run: |
        DESTDIR="$PWD/_install" cmake --install _build
        mkdir _artifacts
        tar -czf _artifacts/eden-linux.tar.gz -C _install .
    - uses: actions/upload-artifact@v6
      with:
        name: eden
        path: _artifacts

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
