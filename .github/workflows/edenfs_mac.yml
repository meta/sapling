name: EdenFS Mac

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "on"
      # sccache caches cargo's crates too, and keeps one server, so the stats
      # at the end cover the whole build.
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      # The C in Rust crates otherwise targets the SDK's macOS version, newer
      # than the one CMake links for, and ld warns about every such object.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # libgit2, which cargo fetches with otherwise, uses SecureTransport on
      # macOS, and it drops the connection while cloning crosvm's submodules
      # from chromium.googlesource.com, sometimes on every retry.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    # eden, fizz and fbthrift require these, and nothing fetches them. gflags,
    # libevent and xxhash are fetched, but eden, wangle and fb303 only build
    # with installed copies. The macOS SDK has curl and zlib, and Xcode has the
    # libclang that edenfsctl's libsqlite3-sys runs bindgen with. The build
    # fetches the rest, folly and Boost among them.
    # TODO(T295212250): fetch these too, as folly does for what it requires,
    # and drop this step.
    - name: Install system deps
      run: >
        brew install
        gflags libevent libsodium ninja openssl@3 pkgconf re2 xxhash zstd

    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@stable

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # eden and its Meta dependencies are exported from one repository within
    # minutes of each other, but build/deps/github_hashes is refreshed about
    # once a day, so a change that spans projects breaks a pinned build until
    # then. FB_FETCH_AS_OF builds every Meta dependency from the commit that was
    # on its main at this commit's time instead. ShipIt dates every exported
    # commit with the time its fbsource commit landed, so that's the code this
    # commit was exported with, on a rerun too.
    - name: Find this commit's time
      run: echo "COMMIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

    # The Python CLI needs thrift-python, which fbthrift builds as a wheel by
    # itself, so build the wheel from the fbthrift of this commit's time and
    # install it with the modules that the CLI and eden's configure check for
    # (psutil and parameterized for the integration tests, which the Test step
    # skips). Configure builds eden from the same fbthrift checkout, so the
    # Python that eden's thrift1 generates matches the wheel's runtime.
    - name: Find the fbthrift of this commit's time
      id: fbthrift
      run: |
        git clone --quiet --bare --filter=tree:0 --single-branch \
          https://github.com/meta/fbthrift.git "$RUNNER_TEMP/fbthrift.git"
        echo "rev=$(git -C "$RUNNER_TEMP/fbthrift.git" rev-list -1 --before="$COMMIT_TIME" main)" \
          >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v6
      with:
        repository: meta/fbthrift
        ref: ${{ steps.fbthrift.outputs.rev }}
        path: _fbthrift
    - name: Install Python modules
      run: >
        pip install "cython>=3.0,<3.2" setuptools wheel delocate
        toml filelock psutil parameterized
    - name: Build thrift-python
      run: |
        cmake -S _fbthrift -B _fbthrift/_build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DTHRIFT_PYTHON=ON \
          -DFB_FETCH_AS_OF="$COMMIT_TIME" \
          -DPython3_EXECUTABLE="$(which python)" \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build _fbthrift/_build -j "$(sysctl -n hw.ncpu)" \
          --target thrift_python_and_py3_bindings
        pip install --no-deps \
          _fbthrift/_build/thrift/lib/cybld/dist_self_contained/*.whl
        rm -rf _fbthrift/_build

    - name: Configure
      run: >
        cmake -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_TESTS=ON
        -DENABLE_THRIFT_PYTHON=ON
        -DFB_FETCH_AS_OF="$COMMIT_TIME"
        -DFETCHCONTENT_SOURCE_DIR_FBTHRIFT="$PWD/_fbthrift"
        -DPython3_EXECUTABLE="$(which python)"
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      run: >
        cmake --build _build -j "$(sysctl -n hw.ncpu)"
        --target edenfs edenfs_privhelper edenfsctl.cargo edenfsctl.real.GEN_PY_EXE

    - name: Build tests
      run: cmake --build _build -j "$(sysctl -n hw.ncpu)"

    # Takeover.manyMounts opens two file descriptors for each of 10,000 mounts.
    # macOS caps the open file limit at kern.maxfilesperproc, so raise that too.
    # The integration tests create repos with a Sapling hg, which this build
    # doesn't build, and mount checkouts.
    - name: Test
      run: |
        sudo sysctl -w kern.maxfiles=131072 kern.maxfilesperproc=65536
        ulimit -n 65536
        ctest --test-dir _build --output-on-failure -E 'integration_tests\.egg::'

    - name: Install
      run: DESTDIR="$PWD/_artifacts/mac" cmake --install _build
    - uses: actions/upload-artifact@v6
      with:
        name: eden
        path: _artifacts

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
