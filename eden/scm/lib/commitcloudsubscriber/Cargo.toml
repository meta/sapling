# @generated by autocargo from //eden/scm/lib/commitcloudsubscriber:commitcloudsubscriber

[package]
name = "sapling-commitcloudsubscriber"
version = "0.1.0"
authors = ["Meta Source Control Team <sourcecontrol-dev@meta.com>"]
edition = "2024"
description = """
    Cross platform client for subscribing to Commit Cloud eventsource (http server-sent events)
    The workflow is the following:
    * define 'subscription' as a unique [repo_name, workspace] pair
    * read set of 'subscribers', defined as [repo_name, workspace, repo_root]
    * runs a Commit Cloud eventsource listener in a separate thread for every 'subscription'
        (and a set of 'subscribers' (repo_roots))
    * triggers `hg cloud sync` command on notifications in all 'subscribers' (repo_roots)
        for a given 'subscription'
    * the library also contains a module to find OAuth token,
        this logic should be in sync with `hg cloud auth` command.
"""
homepage = "https://sapling-scm.com/"
repository = "https://github.com/facebook/sapling"
license = "MIT"
exclude = ["BUCK"]

[lib]
name = "commitcloudsubscriber"

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", features = ["alloc"] }
filetime = "0.2.29"
hostcaps = { version = "0.1.0", git = "https://github.com/facebookexperimental/rust-shed.git", branch = "main" }
log = { version = "0.4.35", features = ["kv_unstable", "kv_unstable_std"] }
mime = "0.3.14"
parking_lot = { version = "0.13.0", features = ["arc_lock", "send_guard", "serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "brotli", "charset", "cookies", "deflate", "gzip", "http2", "json", "multipart", "native-tls", "rustls", "socks", "stream", "system-proxy", "zstd"], default-features = false }
sapling-configset = { version = "0.1.0", path = "../config/set" }
sapling-identity = { version = "0.1.0", path = "../identity" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "test-util", "tracing"] }

[dev-dependencies]
tempfile = "3.27.0"
