sapling-indexedlog = { version = "0.2.0", path = "../indexedlog", optional = true }
sapling-mincode = { version = "0.2.0", path = "../mincode", optional = true }
sapling-minibytes = { version = "0.2.0", path = "../minibytes", default-features = false }
sapling-nonblocking = { version = "0.2.0", path = "../nonblocking" }
sapling-renderdag = { version = "0.2.0", path = "../renderdag", optional = true }
sapling-vlqencoding = { version = "0.2.0", path = "../vlqencoding" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

[dev-dependencies]
ctor = "1.0.13"
quickcheck = "1.1"
sapling-dev-logger = { version = "0.1.0", path = "../dev-logger" }
